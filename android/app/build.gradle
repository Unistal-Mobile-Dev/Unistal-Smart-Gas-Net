plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}



def keystoreProperties = new Properties()


android {
    namespace "com.unistalsmartgasnet.app.flutter_unistal_smart_gas_net"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    flavorDimensions "default"
    productFlavors {
        unistal {
            resValue "string", "app_name", "Unistal Steel"
            applicationIdSuffix ".unistalsmartgasnet.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_unistal",
                    appIconRound: "@mipmap/ic_launcher_unistal"
            ]
            def keystorePropertiesFile = rootProject.file('unistal.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            versionCode 1
            versionName "1.0.0-unistal"
        }
        purvaBharti {
            resValue "string", "app_name", "PBG Steel"
            applicationIdSuffix ".purvabhartisteel.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher",
                    appIconRound: "@mipmap/ic_launcher"
            ]
            def keystorePropertiesFile = rootProject.file('mgl.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            versionCode 1
            versionName "1.0.0-purvaBharti"
        }
        mgl {
            resValue "string", "app_name", "MGL Steel"
            applicationIdSuffix ".mglsteel.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_mgl",
                    appIconRound: "@mipmap/ic_launcher_mgl"
            ]
            def keystorePropertiesFile = rootProject.file('mgl.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            versionCode 1
            versionName "1.0.0-mgl"
        }
        igl {
            resValue "string", "app_name", "IGL Steel"
            applicationIdSuffix ".iglsmartgasnet.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_igl",
                    appIconRound: "@mipmap/ic_launcher_igl"
            ]
            def keystorePropertiesFile = rootProject.file('igl.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            versionCode 1
            versionName "1.0.1-igl"
        }
        oilIndia {
            resValue "string", "app_name", "Oil India Steel"
            applicationIdSuffix ".oilIndia.Smartgasnet.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_unistal",
                    appIconRound: "@mipmap/ic_launcher_unistal"
            ]
            versionCode 1
            versionName "1.0.0-oilIndia"
        }
        vppl {
            resValue "string", "app_name", "VPPL Steel"
            applicationIdSuffix ".vppl.plcms.Smartgasnet.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/vppl_plcms",
                    appIconRound: "@mipmap/vppl_plcms"
            ]
            versionCode 1
            versionName "1.0.0-VPPL"
        }
        vrpl  {
            resValue "string", "app_name", "VRPL Steel"
            applicationIdSuffix ".vrpl.plcms.Smartgasnet.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/vrpl_plcms",
                    appIconRound: "@mipmap/vrpl_plcms"
            ]
            versionCode 1
            versionName "1.0.0-VRPL"
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        multiDexEnabled true
        applicationId "com"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation("com.google.android.play:app-update:2.1.0")
    implementation("com.google.android.play:app-update-ktx:2.1.0")
}
