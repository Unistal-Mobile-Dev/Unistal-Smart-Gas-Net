plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()


android {
    namespace "com.unistalsmartgasnet.app.flutter_unistal_smart_gas_net"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    flavorDimensions "default"
    productFlavors {
        unistal {
            resValue "string", "app_name", "Unistal Steel"
            applicationIdSuffix ".unistalsmartgasnet.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_unistal",
                    appIconRound: "@mipmap/ic_launcher_unistal"
            ]
            def keystorePropertiesFile = rootProject.file('unistal.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
        }
        purvaBharti {
            resValue "string", "app_name", "PBG Steel"
            applicationIdSuffix ".purvabhartisteel.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher",
                    appIconRound: "@mipmap/ic_launcher"
            ]
            def keystorePropertiesFile = rootProject.file('purvaBharti.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
        }
        igl {
            resValue "string", "app_name", "IGL Steel"
            applicationIdSuffix ".iglsmartgasnet.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_igl",
                    appIconRound: "@mipmap/ic_launcher_igl"
            ]
            def keystorePropertiesFile = rootProject.file('igl.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
        }
    }

    defaultConfig {
        multiDexEnabled true
        applicationId "com"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation("com.google.android.play:app-update:2.1.0")
    implementation("com.google.android.play:app-update-ktx:2.1.0")
}
