plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()


android {
    namespace "com.unistalsmartgasnet.app.flutter_unistal_smart_gas_net"
    compileSdkVersion 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    flavorDimensions "default"
    productFlavors {
        unistal {
            resValue "string", "app_name", "Unistal Steel"
            applicationIdSuffix ".unistalsmartgasnet.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_unistal",
                    appIconRound: "@mipmap/ic_launcher_unistal"
            ]
            def keystorePropertiesFile = rootProject.file('unistal.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
        }
        purvaBharti {
            resValue "string", "app_name", "PBG Steel"
            applicationIdSuffix ".purvabhartismartgasnet.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher",
                    appIconRound: "@mipmap/ic_launcher"
            ]
            def keystorePropertiesFile = rootProject.file('purvaBharti.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
        }
        igl {
            resValue "string", "app_name", "IGL Steel"
            applicationIdSuffix ".iglsmartgasnet.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_igl",
                    appIconRound: "@mipmap/ic_launcher_igl"
            ]
            def keystorePropertiesFile = rootProject.file('igl.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com"
        minSdkVersion 21
        targetSdkVersion 34
        multiDexEnabled true
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
